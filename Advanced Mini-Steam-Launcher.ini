; AI 22 Mini-Steam-Launcher-Compact

[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
OnRefreshAction=[!UpdateMeasure "MeasureRebuildOverlayHeight"][!ShowMeter "MeterRebuildOverlayBox"][!ShowMeter "MeterRebuildOverlayText"][!UpdateMeter "MeterRebuildOverlayBox"][!UpdateMeter "MeterRebuildOverlayText"][!Redraw][!CommandMeasure MeasureInitializePlaytime "Run"]
OnCloseAction=[!DeactivateConfigGroup "MiniSteamLauncherChild"]
Group=MiniSteamLauncher

ContextTitle=Settings
ContextAction=[!CommandMeasure MeasurePrepareSettingsDraft "Run"]
ContextTitle2=Rebuild
ContextAction2=[!UpdateMeasure "MeasureRebuildOverlayHeight"][!ShowMeter "MeterRebuildOverlayBox"][!ShowMeter "MeterRebuildOverlayText"][!UpdateMeter "MeterRebuildOverlayBox"][!UpdateMeter "MeterRebuildOverlayText"][!Redraw][!CommandMeasure MeasureInitializePlaytime "Run"]
ContextTitle3=---
ContextAction3=[]
ContextTitle4=Open Recent Games API
ContextAction4=["https://api.steampowered.com/IPlayerService/GetRecentlyPlayedGames/v0001/?key=#SteamAPIKey#&steamid=#SteamID64#&format=json&count=50"]
ContextTitle5=Open Player Summary API
ContextAction5=["https://api.steampowered.com/ISteamUser/GetPlayerSummaries/v0002/?key=#SteamAPIKey#&steamids=#SteamID64#&format=json"]
ContextTitle6=---
ContextAction6=[]

[Metadata]
Name= Mini-Steam-Launcher IZY2091
Author=IZY2091 / Venelder
Version=1.0
License=Creative Commons Attribution-Non-Commercial-Share Alike 3.0
Information=Advanced mini Steam launcher with configurable recent games and achievements. Requires a Steam Web API key and SteamID64. For best tracking, keep Steam set to Online and set your Steam profile and Game Details to Public. AI assisted with some coding, all artwork is sourced from Steam.

@Include=#@#Cache\Data\Games.inc
@Include2=#@#SteamAccountInfo.inc
@Include3=#@#AdvancedSettings.inc

[Variables]
NormalTint=225,225,225,255
HoverTint=255,255,255,255
AchievementPadColor=0,0,0,255
FallbackColor=0,0,0,220
TextColor=255,255,255,255
GameArtWidth=231
GameArtHeight=87
RecordBarHeight=24
InGameIconSize=21
InGameIconPadding=4
CredentialsMissing=0
CredentialsMissingText=

[MeasureInitializePlaytime]
Measure=Plugin
Plugin=RunCommand
Program=powershell.exe
Parameter=-NoProfile -NonInteractive -ExecutionPolicy Bypass -File "#@#InitializePlaytime.ps1" -ConfigName "#CURRENTCONFIG#" -RunStartupUpdate
InputFormat=None
StartInFolder=#@#
State=Hide
OutputType=UTF8
FinishAction=[!HideMeter "MeterRebuildOverlayBox"][!HideMeter "MeterRebuildOverlayText"][!Redraw]

[MeasureUpdatePlayedGames]
Measure=Plugin
Plugin=RunCommand
Program=powershell.exe
Parameter=-NoProfile -NonInteractive -ExecutionPolicy Bypass -File "#@#UpdatePlayedGames.ps1" -ConfigName "#CURRENTCONFIG#" -RebuildDisplay OnChange
InputFormat=None
StartInFolder=#@#
State=Hide
OutputType=UTF8

[MeasureBuildDisplay]
Measure=Plugin
Plugin=RunCommand
Program=powershell.exe
Parameter=-NoProfile -NonInteractive -ExecutionPolicy Bypass -File "#@#BuildDisplay.ps1" -ConfigName "#CURRENTCONFIG#"
InputFormat=None
StartInFolder=#@#
State=Hide
OutputType=UTF8

[MeasureUpdateRecentAchievements]
Measure=Plugin
Plugin=RunCommand
Program=powershell.exe
Parameter=-NoProfile -NonInteractive -ExecutionPolicy Bypass -File "#@#UpdateRecentAchievements.ps1" -ConfigName "#CURRENTCONFIG#" -RebuildDisplay OnChange
InputFormat=None
StartInFolder=#@#
State=Hide
OutputType=UTF8

[MeasurePrepareSettingsDraft]
Measure=Plugin
Plugin=RunCommand
Program=powershell.exe
Parameter=-NoProfile -NonInteractive -ExecutionPolicy Bypass -File "#@#PrepareSettingsDraft.ps1" -ParentConfigName "#CURRENTCONFIG#" -RootConfig "#ROOTCONFIG#"
InputFormat=None
StartInFolder=#@#
State=Hide
OutputType=UTF8
FinishAction=[!ActivateConfig "#ROOTCONFIG#\Config" "Settings.ini"][!Refresh "#ROOTCONFIG#\Config"]
DynamicVariables=1

[MeasureActiveGamePolling]
Measure=Time
Format=%s
UpdateDivider=15
OnUpdateAction=[!CommandMeasure MeasureUpdatePlayedGames "Run"]

[MeasureRecentAchievementPolling]
Measure=Time
Format=%s
UpdateDivider=60
OnUpdateAction=[!CommandMeasure MeasureUpdateRecentAchievements "Run"]

[MeasureRebuildOverlayHeight]
Measure=Calc
Formula=(Max(#GameArtHeight#, Max([MeterProfile:YH], [MeterRecentAchievementsBounds:YH])))
DynamicVariables=1

