[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
MiddleMouseUpAction=[!Refresh]
Group=MiniSteamLauncherChild

[Metadata]
Name=Launcher Settings
Author=Venelder / OpenAI / IZY2091
Version=0.5
License=Creative Commons Attribution-Non-Commercial-Share Alike 3.0
Information=User-friendly settings window.

@Include=#@#SteamAccountInfo.inc
@Include2=#@#AdvancedSettings.inc
@Include3=#@#Cache\Data\SettingsDraft.inc

[Variables]
PanelWidth=260
PanelHeight=574
CenterX=130
ContentX=20
ContentWidth=220
ButtonColor=110,110,110,255
ButtonBorderColor=150,150,150,255
ButtonTextColor=255,255,255,255
TextColor=255,255,255,255
DisabledTextColor=160,160,160,255
DisabledButtonColor=90,90,90,255
DisabledButtonBorderColor=120,120,120,255
DraftSaveButtonColor=110,110,110,255
DraftSaveButtonBorderColor=150,150,150,255
BackgroundColor=70,70,70,255
BackgroundBorderColor=110,110,110,255
OptionBoxX=22
OptionBoxWidth=216
OptionBoxColor=82,82,82,255
OptionBoxBorderColor=150,150,150,255
InfoIconSize=14
InfoIconPadding=4
InfoIconTopPadding=4

[MeasureSettingsController]
Measure=Script
ScriptFile=#@#SettingsController.lua
UpdateDivider=-1
DynamicVariables=1

[MeasureSaveSettingsDraft]
Measure=Plugin
Plugin=RunCommand
Program=powershell.exe
Parameter=-NoProfile -NonInteractive -ExecutionPolicy Bypass -File "#@#SaveSettingsDraft.ps1" -ConfigName "#CURRENTCONFIG#" -ParentConfigName "#DraftParentConfigName#" -RootConfig "#DraftRootConfig#" -DisplayGameCount "#DraftDisplayGameCount#" -RecentlyPlayedExpirationInputValue "#DraftRecentlyPlayedExpirationInputValue#" -RecentlyPlayedExpirationUnit "#DraftRecentlyPlayedExpirationUnit#" -RecentAchievementDisplayCount "#DraftRecentAchievementDisplayCount#" -RecentAchievementExpirationInputValue "#DraftRecentAchievementExpirationInputValue#" -RecentAchievementExpirationUnit "#DraftRecentAchievementExpirationUnit#" -ShowAchievementRarity "#DraftShowAchievementRarity#"
InputFormat=None
StartInFolder=#@#
State=Hide
OutputType=UTF8
FinishAction=[!CommandMeasure MeasureSettingsController "EndSave()"]
DynamicVariables=1

[MeterBackground]
Meter=Shape
Shape=Rectangle 0,0,#PanelWidth#,#PanelHeight#,4 | Fill Color #BackgroundColor# | StrokeWidth 1 | Stroke Color #BackgroundBorderColor#
DynamicVariables=1

[MeterDisplayGamesBox]
Meter=Shape
X=#OptionBoxX#
Y=38
Shape=Rectangle 0,0,#OptionBoxWidth#,62,3 | Fill Color #OptionBoxColor# | StrokeWidth 1 | Stroke Color #OptionBoxBorderColor#
