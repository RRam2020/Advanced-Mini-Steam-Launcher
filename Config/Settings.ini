[MeterDisplayGamesInfo]
Meter=Image
ImageName=#@#Images\info.png
X=(#OptionBoxX# + #OptionBoxWidth# - #InfoIconSize# - #InfoIconPadding#)
Y=(38 + #InfoIconTopPadding#)
W=#InfoIconSize#
H=#InfoIconSize#
PreserveAspectRatio=1
ToolTipTitle=Games Count
ToolTipText=Sets how many game banners the launcher shows. Use 0 to hide the game banner area. Range: 0 to 10.
DynamicVariables=1

[MeterRecentlyPlayedInfo]
